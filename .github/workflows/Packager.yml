name: Build and Package Application

on:
  release:
    types: [ published ]

jobs:
  verify:
    name: Verify sources before packaging
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Offline acceptance contracts
        run: python -m pytest -q -rx

      - name: Validate complete catalogue
        run: python -m validation.catalogue --report catalogue-report.json

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-catalogue-report
          path: catalogue-report.json

  build:
    name: Build for ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        include:
          - os: ubuntu-latest
            artifact_name: BigWorldSetup-Linux.tar.gz
          - os: windows-latest
            artifact_name: BigWorldSetup-Windows.zip

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # The shipped catalogue version is the last commit of data/
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller BigWorldSetup.spec --clean --log-level DEBUG

      - name: Copy external files to dist (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/BigWorldSetup/validation
          cp -r data dist/BigWorldSetup/
          cp -r i18n dist/BigWorldSetup/
          cp -r resources dist/BigWorldSetup/
          cp -r tools dist/BigWorldSetup/
          cp -r validation/schemas dist/BigWorldSetup/validation/
          cp README.md dist/BigWorldSetup/ 2>/dev/null || true
          cp LICENSE dist/BigWorldSetup/ 2>/dev/null || true

      - name: Copy external files to dist (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path dist/BigWorldSetup/validation -Force
          Copy-Item -Path data -Destination dist/BigWorldSetup/ -Recurse -Force
          Copy-Item -Path i18n -Destination dist/BigWorldSetup/ -Recurse -Force
          Copy-Item -Path resources -Destination dist/BigWorldSetup/ -Recurse -Force
          Copy-Item -Path tools -Destination dist/BigWorldSetup/ -Recurse -Force
          Copy-Item -Path validation/schemas -Destination dist/BigWorldSetup/validation/ -Recurse -Force
          if (Test-Path README.md) { Copy-Item README.md dist/BigWorldSetup/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/BigWorldSetup/ }
        shell: pwsh

      # Same format as the version published by data-update.yml, without the
      # checksums of data.zip. The commit date of data/ precedes the publication
      # of the same catalogue: a later download of it, or of a newer one, is read
      # instead, while an older download is not.
      - name: Write shipped catalogue version
        shell: bash
        run: |
          HASH=$(git log -1 --format=%H -- data)
          SHORT_HASH=$(git rev-parse --short "${HASH}")
          TIMESTAMP=$(git log -1 --format=%ct -- data)
          DATE=$(TZ=UTC git log -1 --date=format-local:'%Y-%m-%d %H:%M:%S UTC' --format=%cd -- data)
          SCHEMA_VERSION=$(python -c "from constants import DATA_SCHEMA_VERSION; print(DATA_SCHEMA_VERSION)")

          cat > dist/BigWorldSetup/data/data_version.json << EOF
          {
            "data_schema_version": "${SCHEMA_VERSION}",
            "commit_hash": "${HASH}",
            "short_hash": "${SHORT_HASH}",
            "timestamp": ${TIMESTAMP},
            "date": "${DATE}",
            "version": "data-${SHORT_HASH}"
          }
          EOF
          cat dist/BigWorldSetup/data/data_version.json

      # The package is started from a copy, so that the files it generates are
      # not shipped, and from another working directory, so that a path resolved
      # against the working directory fails the test. Every generated file must
      # land in var/ of the package.
      - name: Smoke test the package from another directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'smoke'
          $package = Join-Path $smokeRoot 'BigWorldSetup'
          $workDir = Join-Path $smokeRoot 'cwd'
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          Copy-Item -Path dist/BigWorldSetup -Destination $smokeRoot -Recurse

          # Both localized caches are complete once their fingerprints are written
          $readyFiles = @('mods.fingerprint.json', 'rules.fingerprint.json') |
            ForEach-Object { Join-Path $package "var/cache/$_" }
          $logFile = Join-Path $package 'var/logs/bws_ng.log'
          $varDir = Join-Path $package 'var'
          $shipped = Get-ChildItem -Path $package -Recurse -Force -File |
            ForEach-Object { $_.FullName }

          $process = Start-Process -FilePath (Join-Path $package 'BigWorldSetup.exe') `
            -WorkingDirectory $workDir -PassThru
          $deadline = (Get-Date).AddMinutes(5)
          while (-not $process.HasExited -and (Get-Date) -lt $deadline -and
                 ($readyFiles | Where-Object { -not (Test-Path $_) })) {
            Start-Sleep -Seconds 2
          }
          # Leave time for the main window to be created after the caches
          if (-not $process.HasExited) { Start-Sleep -Seconds 15 }

          $exited = $process.HasExited
          if (-not $exited) { Stop-Process -Id $process.Id -Force }
          if (Test-Path $logFile) { Get-Content $logFile -Tail 60 }

          $failures = @()
          if ($exited) { $failures += "Application exited during startup (code $($process.ExitCode))" }
          if ($readyFiles | Where-Object { -not (Test-Path $_) }) {
            $failures += 'Mod and rule caches were not built in the package directory'
          }
          if (-not (Test-Path $logFile)) { $failures += 'No log written in the package directory' }
          elseif (Select-String -Path $logFile -Pattern ' - CRITICAL - ' -Quiet) {
            # Fatal initialization errors and uncaught exceptions; network
            # checks may log errors on a shared runner without breaking startup
            $failures += 'Critical error logged during startup'
          }
          if (Get-ChildItem -Path $workDir -Force) { $failures += 'Files written in the working directory' }
          $outsideVar = Get-ChildItem -Path $package -Recurse -Force -File |
            Where-Object { -not $_.FullName.StartsWith("$varDir$([IO.Path]::DirectorySeparatorChar)") -and $shipped -notcontains $_.FullName }
          if ($outsideVar) {
            $outsideVar | ForEach-Object { Write-Host "Generated outside var/: $($_.FullName)" }
            $failures += 'Files generated in the package outside var/'
          }

          if ($failures) {
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Verify build output
        run: |
          ls -R dist/BigWorldSetup/
        shell: bash

      - name: Package build output (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf BigWorldSetup-Linux.tar.gz BigWorldSetup/

      - name: Package build output (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path BigWorldSetup -DestinationPath BigWorldSetup-Windows.zip -Force
        shell: pwsh

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigWorldSetup-${{ runner.os }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Attach packages to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display artifact structure (debug)
        run: ls -R artifacts

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
