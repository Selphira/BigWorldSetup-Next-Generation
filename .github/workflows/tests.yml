name: Offline regression tests

on:
  push:
    branches: [main, develop]
    paths: ['**.py', 'pyproject.toml', 'requirements*.txt', 'validation/**', '.github/workflows/tests.yml']
  pull_request:
    branches: [main, develop]
    paths: ['**.py', 'pyproject.toml', 'requirements*.txt', 'validation/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint L0 additions
        run: python -m ruff check tests validation/catalogue.py validation/snapshot.py
      - name: Offline acceptance contracts
        run: python -m pytest -q -rx --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
