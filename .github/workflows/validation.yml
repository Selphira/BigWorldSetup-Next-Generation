name: Validate complete catalogue

on:
  push:
    branches: [main, develop]
    paths: ['data/**', 'validation/**', 'core/**', 'constants.py', 'requirements.txt', '.github/workflows/validation.yml']
  pull_request:
    branches: [main, develop]
    paths: ['data/**', 'validation/**', 'core/**', 'constants.py', 'requirements.txt', '.github/workflows/validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate schemas and references across the entire catalogue
        run: python -m validation.catalogue --report catalogue-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-report
          path: catalogue-report.json
